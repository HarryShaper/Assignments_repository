show_profile:
  name: "Default Show"
  auto_load_defaults: true
  apply_project_name_on_startup: true
  apply_wranglers_on_startup: true
  apply_email_defaults_on_startup: false

project_defaults:
  project_name: "PROJECT_NAME"
  unit: "Main Unit"

wrangler_defaults:
  options:
    - "Data Wrangler"

  default_selection: "Data Wrangler"

email_defaults:
  enabled_by_default: false
  subject: "{project_name} {clean_package_name} ready for ingestion"
  body: |
    Hi,

    {clean_package_name} is packaged and ready for ingestion.

    Thanks,

  to: []
  cc: []

browser_defaults:
  preferred_browser: "default"